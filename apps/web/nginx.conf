server {
  listen 80;
  client_max_body_size 25m;
  # Re-resolve "api" via Docker's DNS so a recreated api container (new IP)
  # doesn't leave nginx pointing at a dead address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
    proxy_set_header Host $host;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
